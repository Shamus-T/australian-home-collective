name: Audit Amazon affiliate links (offline)
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/monitor-offer-availability.mjs
      - scripts/lib/offer-availability.mjs
      - scripts/research-url.mjs
      - tests/offer-availability.test.mjs
      - tests/research-url.test.mjs
      - src/data/commercial-products.json
      - .github/workflows/monitor-amazon-availability.yml
permissions:
  contents: read
concurrency:
  group: monitor-amazon
  cancel-in-progress: false
jobs:
  audit-amazon-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test no-click safety and availability decisions
        run: node --test tests/research-url.test.mjs tests/offer-availability.test.mjs
      - name: Audit approved affiliate destinations offline
        run: npm run audit:commercial
      - name: Explain separate local availability coverage
        run: |
          echo '## Amazon link structure checked offline' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is NOT a stock check. Amazon challenged the GitHub-hosted requests on 24 October 2026. Live availability is checked daily by the AHC affiliate availability follow-up on the local computer, using clean product URLs. Local results: tmp/availability-monitor/amazon.json. An unavailable computer or blocked retailer response must be reported as missing/unverified coverage, never as healthy stock.' >> "$GITHUB_STEP_SUMMARY"
