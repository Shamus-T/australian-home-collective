name: Stamp printable PDF QR links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-pdf-qr.py'
      - '.github/workflows/stamp-printable-pdf-qr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pypdf reportlab qrcode[pil]
      - name: Add canonical QR return links
        run: python scripts/add-pdf-qr.py
      - name: Commit regenerated PDFs
        run: |
          if git diff --quiet -- public/downloads; then
            echo 'Printable PDFs already meet QR standard.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/*.pdf
          git commit -m 'Add QR return links to printable PDFs'
          git pull --rebase origin main
          git push origin HEAD:main
