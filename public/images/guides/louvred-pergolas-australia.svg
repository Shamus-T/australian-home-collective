<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Measure the roof, the posts and the movement</title>
  <desc id="desc">Conceptual pergola planning illustration. A blue louvred roof sits over four posts and an outdoor dining table. Dotted outlines distinguish the outside footprint and the usable space. Not a construction drawing.</desc>
