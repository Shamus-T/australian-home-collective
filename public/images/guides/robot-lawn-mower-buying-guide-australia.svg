<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Plan the whole mowing route</title>
<desc id="desc">An illustrative overhead yard plan. A house and paved path divide two grass areas. A narrow side passage, a tree canopy, a charging station and the lawn edges all need checking.</desc>
