<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title desc">
  <title id="title">Fridge delivery: packaged size, doorways and turns</title>
  <desc id="desc">A tall fridge carton has width, height and depth labels. A separate top view shows a doorway and a tight turn along a delivery route. The path is illustrative and does not guarantee that a fridge will fit or can be tilted safely.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#245b63"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #263b3e; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .wall { fill: none; stroke: #a1b7ae; stroke-width: 9; }
  </style>
  <rect width="560" height="480" rx="14" fill="#f4f7f5"/>
  <text x="28" y="36" class="small">DELIVERY CHECKS</text>
  <!-- A tall packaged fridge, with no model dimensions assumed. -->
  <text x="28" y="68" class="small">Packaged size</text>
  <path d="M73 112L98 91H161L138 112Z" fill="#efe5d3" stroke="#a99065" stroke-width="2"/>
  <path d="M138 112L161 91V204L138 225Z" fill="#e1d5bc" stroke="#a99065" stroke-width="2"/>
  <rect x="73" y="112" width="65" height="113" fill="#f4e9d7" stroke="#a99065" stroke-width="2"/>
  <path d="M105 113V225" stroke="#d0b890" stroke-width="5"/>
  <text x="104" y="247" class="small" text-anchor="middle">W</text>
  <text x="46" y="174" class="small">H</text>
  <text x="168" y="108" class="small">D</text>
  <text x="280" y="68" class="small">Route: top view</text>
  <!-- An L-shaped corridor, with a doorway across the entrance. -->
  <path d="M80 250H285V95H440V390H80Z" fill="#fff"/>
  <path class="wall" d="M80 250H285V95M80 390H440V95"/>
  <path class="wall" d="M135 250V277M135 366V390"/>
  <path d="M126 277H144M126 366H144" stroke="#516d70" stroke-width="3"/>
  <text x="28" y="287" class="small">Doorway</text>
  <path d="M109 291L130 280" stroke="#819894" stroke-width="2"/>
  <path d="M75 321H224Q357 321 357 200V146" fill="none" stroke="#245b63" stroke-width="4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <!-- Package footprints remind the reader to consider the turn, not just doorway width. -->
  <rect x="185" y="286" width="66" height="70" rx="3" fill="#f4e9d7" stroke="#a99065" stroke-width="2"/>
  <path d="M218 286V356" stroke="#d0b890" stroke-width="5"/>
  <rect x="295" y="258" width="66" height="70" rx="3" transform="rotate(-32 328 293)" fill="#f4e9d7" fill-opacity="0.75" stroke="#a99065" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="461" y="260" class="small">Check</text>
  <text x="461" y="282" class="small">the turn</text>
  <path d="M457 289L368 299" stroke="#819894" stroke-width="2"/>
  <text x="28" y="423" class="label">Check packaged dimensions</text>
  <text x="28" y="456" class="label">Measure doors, turns and access</text>
</svg>
