<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title desc"><title id="title">Dishwasher body depth and open door</title><desc id="desc">Side view. C measures body depth. D measures depth with the door open. The hose route is a separate check. Leave additional space to extend the rack and stand in front. Not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245b63"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b3e}.label{font-size:22px;font-weight:700}.small{font-size:18px}.dim{stroke:#245b63;stroke-width:2.5;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#819894;stroke-width:1.5;stroke-dasharray:5 5}.machine{fill:#fff;stroke:#516d70;stroke-width:3}.note{fill:#245b63;font-size:19px}</style><rect width="560" height="480" rx="14" fill="#f4f7f5"/><text x="28" y="36" class="small">SIDE VIEW · DROP-DOWN DOOR</text><rect class="machine" x="121" y="118" width="185" height="217" rx="4"/><path d="M286 129V324" stroke="#a1b7ae" stroke-width="2"/><path d="M80 351H535" stroke="#657e75" stroke-width="3"/><path d="M306 334H522V342H306Z" fill="#d5e4e1" stroke="#516d70" stroke-width="3"/><path d="M306 120A215 215 0 0 1 521 335" fill="none" stroke="#b18a4a" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M123 294H59V226" fill="none" stroke="#b18a4a" stroke-width="4" stroke-dasharray="6 4"/><text x="28" y="184" class="small">Check</text><text x="28" y="208" class="small">services</text><text x="333" y="281" class="small">Door swing</text><line class="guide" x1="121" y1="83" x2="121" y2="113"/><line class="guide" x1="306" y1="83" x2="306" y2="113"/><line class="dim" x1="129" y1="88" x2="298" y2="88"/><rect x="199" y="69" width="29" height="35" rx="7" fill="#f4f7f5"/><text x="214" y="95" class="label" text-anchor="middle">C</text><line class="g