<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title desc"><title id="title">Washing machine opening: width and height</title><desc id="desc">Front view. A measures the finished opening width. B measures from the finished floor to the underside above. The appliance is illustrative and no standard clearance is specified.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245b63"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b3e}.label{font-size:22px;font-weight:700}.small{font-size:18px}.dim{stroke:#245b63;stroke-width:2.5;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#819894;stroke-width:1.5;stroke-dasharray:5 5}.machine{fill:#fff;stroke:#516d70;stroke-width:3}.note{fill:#245b63;font-size:19px}</style><rect width="560" height="480" rx="14" fill="#f4f7f5"/><text x="28" y="36" class="small">FRONT VIEW</text><path d="M112 90H448V369H418V112H142V369H112Z" fill="#d4e2dd" stroke="#a1b7ae" stroke-width="2"/><path d="M86 374H475" stroke="#657e75" stroke-width="4"/><rect class="machine" x="173" y="153" width="210" height="207" rx="9"/><path d="M173 194H383" stroke="#819894" stroke-width="2"/><rect x="190" y="168" width="52" height="11" rx="3" fill="#d5e4e1"/><circle cx="345" cy="175" r="10" fill="#d5e4e1"/><circle cx="278" cy="270" r="57" fill="#dbe9e7" stroke="#516d70" stroke-width="3"/><circle cx="278" cy="270" r="42" fill="#eef4f2" stroke="#819894" stroke-width="2"/><line class="dim" x1="150" y1="127" x2="410" y2="127"/><rect x="264" y="108" width="28" height="35" rx="8" fill="#f4f7f5"/><text x="278" y="133" class="label" text-anchor="middle">A</text><line class="guide" x1="66" y1="113" x2="128" y2="113"/><line class="guide" x1="66" y1="369" x2="128" y2="369"/><line class="dim" x1="81" y1="121" x2="81" y2="361"/><rect x="67" y="224" width="29" height="35" rx="8" fill="#f4f7f5"/><text x="81" y="250" class="label" text-anchor="middle">B</text><text x="28" y="422" class="label">A  Finished opening width</text><text x="28" y="456" class="label">B  Floor to underside above</text></svg>
