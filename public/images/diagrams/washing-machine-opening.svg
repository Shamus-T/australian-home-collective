<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title desc">
  <title id="title">Washing machine opening: width and height</title>
  <desc id="desc">Front view of a washing machine drawn in the proportions of a 600 mm wide, 850 mm high front loader. A measures the finished opening width. B measures from the finished floor to the underside above. The surrounding gaps are illustrative and do not specify a clearance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245b63"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #263b3e; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .dim { stroke: #245b63; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .guide { stroke: #819894; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .machine { fill: #fff; stroke: #516d70; stroke-width: 3; }
  </style>
  <rect width="560" height="480" rx="14" fill="#f4f7f5"/>
  <text x="28" y="36" class="small">FRONT VIEW</text>
  <!-- Finished cupboard opening: dimension arrows measure the opening, not the appliance. -->
  <path d="M142 76H418V390H396V98H164V390H142Z" fill="#d4e2dd" stroke="#a1b7ae" stroke-width="2"/>
  <path d="M86 390H475" stroke="#657e75" stroke-width="4"/>
  <!-- Scale for the example front view: 0.34 pixels per mm; 600 x 850 mm = 204 x 289 pixels. -->
  <rect class="machine" x="178" y="101" width="204" height="289" rx="9"/>
  <path d="M178 146H382" stroke="#819894" stroke-width="2"/>
  <rect x="194" y="117" width="52" height="13" rx="3" fill="#d5e4e1"/>
  <circle cx="346" cy="124" r="10" fill="#d5e4e1"/>
  <circle cx="280" cy="245" r="64" fill="#dbe9e7" stroke="#516d70" stroke-width="3"/>
  <circle cx="280" cy="245" r="49" fill="#eef4f2" stroke="#819894" stroke-width="2"/>
  <path d="M184 357H376" stroke="#819894" stroke-width="1.5"/>
  <rect x="340" y="366" width="25" height="15" rx="3" fill="#edf3f1" stroke="#819894"/>
  <line class="guide" x1="164" y1="53" x2="164" y2="97"/>
  <line class="guide" x1="396" y1="53" x2="396" y2="97"/>
  <line class="dim" x1="164" y1="61" x2="396" y2="61"/>
  <rect x="266" y="43" width="28" height="34" rx="8" fill="#f4f7f5"/>
  <text x="280" y="68" class="label" text-anchor="middle">A</text>
  <line class="guide" x1="103" y1="98" x2="164" y2="98"/>
  <line class="guide" x1="103" y1="390" x2="142" y2="390"/>
  <line class="dim" x1="112" y1="98" x2="112" y2="390"/>
  <rect x="98" y="224" width="29" height="35" rx="8" fill="#f4f7f5"/>
  <text x="112" y="250" class="label" text-anchor="middle">B</text>
  <text x="28" y="422" class="label">A  Finished opening width</text>
  <text x="28" y="456" class="label">B  Floor to underside above</text>
</svg>
