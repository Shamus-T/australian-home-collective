<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title desc"><title id="title">Washing machine body depth and door-open space</title><desc id="desc">Top view of a front loader. C measures the machine body depth. D measures to the open door. A separate dashed zone behind shows that service routing also needs checking. Additional loading space is required. Not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245b63"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b3e}.label{font-size:22px;font-weight:700}.small{font-size:18px}.dim{stroke:#245b63;stroke-width:2.5;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#819894;stroke-width:1.5;stroke-dasharray:5 5}.machine{fill:#fff;stroke:#516d70;stroke-width:3}.note{fill:#245b63;font-size:19px}</style><rect width="560" height="480" rx="14" fill="#f4f7f5"/><text x="28" y="36" class="small">TOP VIEW · FRONT LOADER</text><rect x="105" y="62" width="215" height="39" rx="6" fill="#f4e9d7" stroke="#b18a4a" stroke-width="2" stroke-dasharray="5 4"/><text x="345" y="79" class="small">Check services</text><path d="M334 76L310 82" stroke="#b18a4a" stroke-width="2"/><rect class="machine" x="105" y="110" width="215" height="178" rx="8"/><rect x="132" y="130" width="161" height="120" rx="10" fill="#edf3f1"/><path d="M147 288H242" stroke="#819894" stroke-width="4" stroke-dasharray="6 4"/><path d="M242 288A95 95 0 0 1 147 383" fill="none" stroke="#b18a4a" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M147 288V383" stroke="#516d70" stroke-width="8" stroke-linecap="round"/><text x="182" y="345" class="small">Door swing</text><line class="dim" x1="356" y1="118" x2="356" y2="280"/><rect x="343" y="182" width="27" height="34" rx="7" fill="#f4f7f5"/><text x="356" y="207" class="label" text-anchor="middle">C</text><line class="guide" x1="325" y1="110" x2="475" y2="110"/><line class="guide" x1="156" y1="383" x2="475" y2="383"/><line class="dim" x1="455" y1="118" x2="455" y2="375"/><rect x="441" y="230" width="28" height="35" rx="7" fill="#f4f7f5"/><text x="455" y="255" class="label" text-anchor="middle">D</text><text x="28" y="423" class="label">C  Appliance body depth</text><text x="28" y="456" class="label">D  Depth with door open</text></svg>
