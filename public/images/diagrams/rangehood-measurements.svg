<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Rangehood measurements to record</title>
  <desc id="desc">Front and side views separate the cabinet opening, cooktop width, canopy depth and the cooktop-to-hood distance. The drawing specifies no minimum clearance.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245b63"/></marker></defs>
  <rect width="1000" height="560" fill="#f8faf8" rx="14"/>
  <g font-family="Arial, sans-serif" fill="#244c3d">
    <text x="42" y="45" font-size="24" font-weight="700">Measure the space, then check the manuals</text>
    <text x="42" y="75" font-size="17">Illustrative only. No minimum clearance is shown.</text>
    <text x="220" y="121" font-size="19" font-weight="700">Front view</text>
    <text x="713" y="121" font-size="19" font-weight="700">Side view</text>
  </g>
  <g stroke="#87978e" stroke-width="3" fill="#e6eeea">
    <rect x="118" y="182" width="330" height="132"/>
    <rect x="139" y="257" width="288" height="48" fill="#cdd8d5"/>
    <path d="M108 445H458V465H108Z" fill="#e0ded6"/>
    <rect x="687" y="182" width="70" height="70"/>
    <path d="M671 252H796L858 288V305H671Z" fill="#cdd8d5"/>
    <path d="M671 445H905V465H671Z" fill="#e0ded6"/>
  </g>
  <g fill="none" stroke="#26372e" stroke-width="3">
    <path d="M161 289H405M161 279H405M140 437H220M347 437H427M711 437H751M830 437H870"/>
    <path d="M671 171V468" stroke="#b5bfb9"/>
  </g>
  <g stroke="#245b63" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M118 160H448"/>
    <path d="M139 492H427"/>
    <path d="M627 305V437"/>
    <path d="M671 330H858"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#244c3d">
    <text x="199" y="149">Cabinet opening</text>
    <text x="214" y="520">Cooktop width</text>
    <text x="706" y="357">Canopy depth</text>
    <text x="490" y="371">Cooktop</text><text x="490" y="395">to hood*</text>
    <text x="506" y="501" font-size="15">*Confirm the measuring points and required</text>
    <text x="506" y="524" font-size="15">distance with the manuals and installer.</text>
  </g>
</svg>
